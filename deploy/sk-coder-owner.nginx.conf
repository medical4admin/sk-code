server {
    listen 80;
    server_name admin.sk-coder.site;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.sk-coder.site;

    ssl_certificate /etc/letsencrypt/live/admin.sk-coder.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.sk-coder.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "SK Coder Owner Dashboard";
    auth_basic_user_file /etc/nginx/sk-coder-owner.htpasswd;

    root /opt/sk-coder-backend/source/frontend/dist/public;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
